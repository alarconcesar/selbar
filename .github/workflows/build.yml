name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Una rama que se empuja dos veces cancela la ejecución anterior. En tags NO se
# cancela: un release a medias dejaría artefactos sueltos sin release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    name: Tests de lógica (offline)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar
        run: dotnet restore tools\SelfTest\SelfTest.csproj
      - name: Auto-tests
        run: dotnet run --project tools\SelfTest\SelfTest.csproj -c Release --no-restore

      - name: Versiones (csproj = installer.iss)
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src\Selbar\Selbar.csproj
          $v = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if (-not $v) { throw "El .csproj no declara <Version>." }
          $m = Select-String -Path tools\installer.iss -Pattern '#define MyVersion "([^"]+)"' | Select-Object -First 1
          if (-not $m) { throw "tools/installer.iss no declara #define MyVersion." }
          $iss = $m.Matches[0].Groups[1].Value
          if ($v -ne $iss) { throw "Versión distinta: csproj=$v, installer.iss=$iss. Sincronízalas." }
          Write-Host "Versión $v (csproj = installer.iss)"

  package:
    name: Publicar ${{ matrix.rid }}
    needs: tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versión
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src\Selbar\Selbar.csproj
          $v = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if (-not $v) { throw "El .csproj no declara <Version>." }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publicar
        run: >
          dotnet publish src\Selbar\Selbar.csproj -c Release
          -r ${{ matrix.rid }} --self-contained true
          -o dist\Selbar-${{ steps.version.outputs.version }}

      # Mismo contenido que build.ps1: el ZIP local y el del CI deben ser
      # intercambiables (portable.txt activa .\data junto al .exe).
      - name: Modo portable
        shell: pwsh
        run: |
          $dir = "dist\Selbar-${{ steps.version.outputs.version }}"
          if (-not (Test-Path "$dir\Selbar.exe")) { throw "La publicación no generó Selbar.exe." }
          Set-Content "$dir\portable.txt" "Selbar en modo portable: los ajustes se guardan en la carpeta .\data" -Encoding UTF8
          Copy-Item README.md "$dir\LEEME.md" -Force
          Get-ChildItem $dir -Filter '*.pdb' -ErrorAction SilentlyContinue | Remove-Item -Force

      - name: Empaquetar
        shell: pwsh
        run: |
          $dir = "dist\Selbar-${{ steps.version.outputs.version }}"
          Compress-Archive -Path "$dir\*" `
            -DestinationPath "Selbar-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Selbar-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: Selbar-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Release (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Un tag v0.14.0 con el .csproj en 0.13.1 publicaba una release cuyo ZIP se
      # llama distinto: se corta antes de publicar nada.
      - name: El tag coincide con la versión
        shell: bash
        run: |
          v=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('src/Selbar/Selbar.csproj').getroot().find('.//Version').text.strip())")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$v" ]; then
            echo "El tag v$tag no coincide con la versión del .csproj ($v)"
            exit 1
          fi
          echo "Tag y versión coinciden: $v"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
